name: Build release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            osName: macOS
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            label: macOS-AppleSilicon
          - os: macos-latest
            osName: macOS
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            label: macOS-Intel
          - os: ubuntu-22.04
            osName: Linux
            target: ""
            args: ""
            label: Linux
          - os: windows-latest
            osName: Windows
            target: ""
            args: ""
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libudev-dev \
            libdbus-1-dev \
            pkg-config \
            build-essential \
            patchelf \
            xdg-utils \
            file \
            rpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        with:
          args: ${{ matrix.args }}

      - name: Collect bundles with OS-labeled names
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json | tr -d '\r')
          mkdir -p dist
          echo "$ARTIFACT_PATHS" | jq -r '.[]' | tr -d '\r' | while IFS= read -r f; do
            f="${f//\\//}"
            [ -z "$f" ] && continue
            [ -d "$f" ] && continue
            base=$(basename "$f")
            case "$base" in
              *.exe | *.msi | *.deb | *.rpm | *.AppImage | *.dmg | *.app.tar.gz)
                rest="${base#MFKey Desktop[_-]$VERSION[_-]}"
                rest="${rest// /-}"
                cp "$f" "dist/MFKey-Desktop_${VERSION}_${{ matrix.osName }}_${rest}"
                ;;
            esac
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: MFKey-Desktop-${{ matrix.label }}
          if-no-files-found: error
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from changelog
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            /^##[[:space:]]/ {
              if (capture == 1) { exit }
              if (index($0, ver) > 0) { capture = 1; next }
            }
            capture == 1 { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "See the assets to download and install this version." > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MFKey Desktop v${{ steps.version.outputs.version }}
          files: release/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
