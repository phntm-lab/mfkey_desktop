name: Build release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            label: macOS-AppleSilicon
          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            label: macOS-Intel
          - os: ubuntu-22.04
            target: ""
            args: ""
            label: Linux
          - os: windows-latest
            target: ""
            args: ""
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libudev-dev \
            libdbus-1-dev \
            pkg-config \
            build-essential \
            patchelf \
            xdg-utils \
            file \
            rpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Extract release notes from changelog
        id: changelog
        shell: bash
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          BODY=$(awk -v ver="$VERSION" '
            /^##[[:space:]]/ {
              if (capture == 1) { exit }
              if (index($0, ver) > 0) { capture = 1; next }
            }
            capture == 1 { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="See the assets to download and install this version."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "MFKey Desktop v__VERSION__"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
