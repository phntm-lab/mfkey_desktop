name: Build dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle (${{ matrix.label }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      endsWith(github.event.head_commit.message, '[build]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            osName: macOS
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            label: macOS-AppleSilicon
          - os: macos-latest
            osName: macOS
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            label: macOS-Intel
          - os: ubuntu-22.04
            osName: Linux
            target: ""
            args: ""
            label: Linux
          - os: windows-latest
            osName: Windows
            target: ""
            args: ""
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libudev-dev \
            libdbus-1-dev \
            pkg-config \
            build-essential \
            patchelf \
            xdg-utils \
            file \
            rpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        with:
          args: ${{ matrix.args }}

      - name: Collect bundles with OS-labeled names
        shell: bash
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          mkdir -p dist
          echo '${{ steps.tauri.outputs.artifactPaths }}' | jq -r '.[]' | while read -r f; do
            [ -z "$f" ] && continue
            [ -d "$f" ] && continue
            base=$(basename "$f")
            case "$base" in
              *.exe | *.msi | *.deb | *.rpm | *.AppImage | *.dmg | *.app.tar.gz)
                rest="${base#MFKey Desktop[_-]$VERSION[_-]}"
                rest="${rest// /-}"
                cp "$f" "dist/MFKey-Desktop_${VERSION}_${{ matrix.osName }}_${rest}"
                ;;
            esac
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: MFKey-Desktop-${{ matrix.label }}
          if-no-files-found: error
          path: dist/*
