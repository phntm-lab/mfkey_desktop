[workspace]
members = [".", "crates/mfkey-core", "crates/mfkey-flipper"]
resolver = "3"

[workspace.package]
version = "1.0.8"
edition = "2024"
authors = ["Lemn4t"]
license = "GPL-3.0-only"
repository = "https://github.com/phntm-lab/mfkey_desktop"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[package]
name = "mfkey_desktop"
version = "1.0.0"
description = "Recover MIFARE Classic keys from Flipper Zero nonce logs."
authors = ["Lemn4t"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mfkey_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mfkey-core = { path = "crates/mfkey-core" }
mfkey-flipper = { path = "crates/mfkey-flipper" }
tauri-plugin-mcp-bridge = { version = "0.12", optional = true }

[features]
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

